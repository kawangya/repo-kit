<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub UI 中转站</title>
    <!-- 预连接加速 -->
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" />
    <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com" />
    <!-- Font Awesome 6 (免费版) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        /* ===== 全局重置 & 基础 ===== */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0b0b1a;
            --bg-card: rgba(255, 255, 255, 0.05);
            --border-card: rgba(255, 255, 255, 0.08);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.75);
            --text-muted: rgba(255, 255, 255, 0.45);
            --accent-purple: #7c5cfc;
            --accent-blue: #5cc9fc;
            --shadow-card: 0 20px 60px rgba(0, 0, 0, 0.5);
            --radius-card: 24px;
            --transition: 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        html {
            font-size: 16px;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: var(--font-stack);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-primary);
            background-image:
                radial-gradient(ellipse at 20% 50%, rgba(124, 92, 252, 0.12) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(92, 201, 252, 0.10) 0%, transparent 60%);
            padding: 20px;
            margin: 0;
        }

        /* ===== 背景装饰光晕 ===== */
        body::before {
            content: '';
            position: fixed;
            top: -30%;
            left: -20%;
            width: 70%;
            height: 70%;
            background: radial-gradient(circle, rgba(124, 92, 252, 0.08) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
            animation: glowFloat 20s ease-in-out infinite alternate;
        }
        body::after {
            content: '';
            position: fixed;
            bottom: -30%;
            right: -20%;
            width: 60%;
            height: 60%;
            background: radial-gradient(circle, rgba(92, 201, 252, 0.06) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
            animation: glowFloat 25s ease-in-out infinite alternate-reverse;
        }

        @keyframes glowFloat {
            0% {
                transform: translate(0, 0) scale(1);
            }
            100% {
                transform: translate(40px, -30px) scale(1.1);
            }
        }

        /* ===== 主容器 ===== */
        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 820px;
            margin: 0 auto;
            padding: 10px 0;
        }

        /* ===== 头部 ===== */
        .header {
            text-align: center;
            margin-bottom: 48px;
            padding: 0 12px;
        }

        .header h1 {
            font-size: clamp(2.2rem, 6vw, 3.4rem);
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.02em;
            line-height: 1.1;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #ffffff 40%, rgba(255, 255, 255, 0.7) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            font-size: clamp(0.95rem, 1.6vw, 1.1rem);
            color: var(--text-secondary);
            font-weight: 400;
            letter-spacing: 0.3px;
        }
        .header p i {
            color: var(--accent-blue);
            margin: 0 6px;
        }

        /* ===== 卡片网格 ===== */
        .cards {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            padding: 0 4px;
        }

        /* ===== 单个卡片 ===== */
        .card {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding: 34px 28px 30px;
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: var(--radius-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: var(--shadow-card);
            text-decoration: none;
            color: var(--text-primary);
            transition: transform var(--transition), box-shadow var(--transition), border-color var(--transition);
            position: relative;
            overflow: hidden;
            will-change: transform;
        }

        /* 卡片悬停效果 */
        .card:hover {
            transform: translateY(-8px) scale(1.01);
            box-shadow: 0 32px 80px rgba(0, 0, 0, 0.65);
            border-color: rgba(255, 255, 255, 0.15);
        }

        /* 顶部彩色装饰线 */
        .card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            border-radius: var(--radius-card) var(--radius-card) 0 0;
            opacity: 0.7;
            transition: opacity var(--transition);
        }
        .card-repo::after {
            background: linear-gradient(90deg, var(--accent-purple), var(--accent-blue));
        }
        .card-mobile::after {
            background: linear-gradient(90deg, var(--accent-blue), var(--accent-purple));
        }

        .card-icon {
            width: 58px;
            height: 58px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.7rem;
            margin-bottom: 20px;
            flex-shrink: 0;
            transition: transform var(--transition);
        }
        .card-repo .card-icon {
            background: rgba(124, 92, 252, 0.18);
            color: var(--accent-purple);
        }
        .card-mobile .card-icon {
            background: rgba(92, 201, 252, 0.18);
            color: var(--accent-blue);
        }
        .card:hover .card-icon {
            transform: scale(1.05) rotate(-3deg);
        }

        .card h2 {
            font-size: 1.4rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
            letter-spacing: -0.01em;
        }

        .card-desc {
            font-size: 0.95rem;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 24px;
            flex: 1;
        }

        .card-action {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 28px;
            border-radius: 100px;
            font-weight: 550;
            font-size: 0.9rem;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
            color: #ffffff;
            border: none;
            cursor: pointer;
            transition: transform var(--transition), box-shadow var(--transition);
            text-decoration: none;
            box-shadow: 0 4px 24px rgba(124, 92, 252, 0.30);
            letter-spacing: 0.2px;
        }
        .card-action i {
            font-size: 0.75rem;
            transition: transform var(--transition);
        }
        .card-action:hover {
            transform: translateX(5px);
            box-shadow: 0 8px 32px rgba(124, 92, 252, 0.45);
        }
        .card-action:hover i {
            transform: translateX(5px);
        }

        /* ===== 响应式 ===== */
        @media (max-width: 640px) {
            body {
                padding: 16px;
                align-items: flex-start;
                padding-top: 40px;
            }

            .header {
                margin-bottom: 32px;
            }
            .header h1 {
                font-size: 1.9rem;
            }
            .header p {
                font-size: 0.9rem;
            }

            .cards {
                grid-template-columns: 1fr;
                gap: 18px;
                padding: 0;
            }

            .card {
                padding: 26px 22px 24px;
                border-radius: 20px;
            }
            .card-icon {
                width: 50px;
                height: 50px;
                font-size: 1.4rem;
                border-radius: 14px;
                margin-bottom: 16px;
            }
            .card h2 {
                font-size: 1.2rem;
            }
            .card-desc {
                font-size: 0.88rem;
                margin-bottom: 20px;
            }
            .card-action {
                padding: 10px 22px;
                font-size: 0.85rem;
            }
        }

        @media (max-width: 380px) {
            .card {
                padding: 20px 16px 20px;
            }
            .card-icon {
                width: 44px;
                height: 44px;
                font-size: 1.2rem;
            }
            .card h2 {
                font-size: 1.05rem;
            }
            .header h1 {
                font-size: 1.6rem;
            }
        }

        /* ===== 滚动条美化 ===== */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.12);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.20);
        }

        /* ===== 入场动画 ===== */
        .container>* {
            opacity: 0;
            animation: fadeUp 0.5s ease-out forwards;
        }
        .header {
            animation-delay: 0.04s;
        }
        .card:nth-child(1) {
            animation-delay: 0.10s;
        }
        .card:nth-child(2) {
            animation-delay: 0.18s;
        }

        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        ::selection {
            background: rgba(124, 92, 252, 0.35);
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="container" role="main">

        <!-- ===== 极简头部 ===== -->
        <header class="header">
            <h1>GitHub 中转站</h1>
            <p>
                <i class="fa-regular fa-compass"></i>
                同一功能，两种界面，按需切换
            </p>
        </header>

        <!-- ===== 双卡选择 ===== -->
        <div class="cards">

            <!-- 卡片 1: 仓库管理器 (桌面/经典UI) -->
            <a href="gk-glq.html" target="_blank" rel="noopener noreferrer" class="card card-repo" aria-label="进入仓库管理器">
                <div class="card-icon">
                    <i class="fa-solid fa-window-maximize" aria-hidden="true"></i>
                </div>
                <h2>📊 仓库管理器</h2>
                <p class="card-desc">
                    经典桌面级视图 · 适合深度管理与全局操作
                </p>
                <span class="card-action">
                    进入 <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
                </span>
            </a>

            <!-- 卡片 2: 移动工作台 (移动/轻量UI) -->
            <a href="gk-gzt.html" target="_blank" rel="noopener noreferrer" class="card card-mobile" aria-label="进入移动工作台">
                <div class="card-icon">
                    <i class="fa-solid fa-mobile-screen" aria-hidden="true"></i>
                </div>
                <h2>📱 移动工作台</h2>
                <p class="card-desc">
                    移动优先视图 · 触手可及的轻量高效操作
                </p>
                <span class="card-action">
                    进入 <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
                </span>
            </a>

        </div>

    </div>

    <!-- ===== 键盘快捷键 (1和2快速跳转，不加多余UI) ===== -->
    <script>
        (function() {
            'use strict';
            document.addEventListener('keydown', function(e) {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
                const cards = document.querySelectorAll('.card');
                if (e.key === '1' && cards[0]) {
                    e.preventDefault();
                    cards[0].click();
                } else if (e.key === '2' && cards[1]) {
                    e.preventDefault();
                    cards[1].click();
                }
            });
        })();
    </script>

</body>
</html>
